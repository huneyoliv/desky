                    t: 위로해주는 잔잔한 목소리
                    dc: 힘들때 따듯한 목소리로 위로해주는 곡 우울하지만 약간 신나는 파트도 있는곡
                    a: 💗🫶🏻🎂👍🏻
                    d: 216
                    l: "1절: \n돌아오는것도 왠지 겁이 날 정도로 힘들었던 날들\n기댈 사람이 없어서\n안심할 사람이 없어서\n\
                      힘들때 같이 울어주는 그런 사람이 없어서\n얼마나 힘들었는지 알아\n애원하며 내 처지를 알아달라고 하는 나를\
                      \ 보고\n사람들은 나를 그냥 피하는것같더라\n\n후렴:\n사람이 무서워지고\n내 자신을 잃을때쯤\n더욱 더\
                      \ 성장한 너가 될거라 나는 믿어\n아플만큼 아팠다 생각해서\n더 행복해진줄 알았는데\n그건 그냥 내 착각이였자\
                      \ 뭐야\n\n2절:\n그래도 참아보려고\n내가 널 꼭 안아줄게\n인생을 살다 보면\n이런 날들이 아주 많이\
                      \ 있을거야\n때론 모들걸 쏟은 사람이 떠날수도 있고\n아주 싫어하는 사람이 좋은 사람으로 변할수도 있는거야\n\
                      \n후렴:\n괜찮아\n너 존재자체는 그냥 빛나\n너는 누군가에게 사랑받을 존재야\n괜찮아\n어떤 힘든일이 있다\
                      \ 해도 곧 괜찮아질거야\n너무 걱정하거나 불안해 하지마\n넘어지면 다시 일어나면 돼\n그런 일이 계속 반복되면\n\
                      그래,\n너를 사랑하는 사람을 만나고\n행복해줄거야\n괜찮아, 너 존재 자체가 사랑스러워"
