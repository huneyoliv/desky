                    a: LUUミდ
                    d: 298
                    l: '창문 틈으로 스며든 아침이

                      오늘도 내 이름을 불러오면

                      괜찮은 척 웃어 보이지만

                      거울 속 나는 조금 더 작아져


                      달력 위에 동그라미 친 날들

                      한 장씩 바람 따라 흩어지고

                      아직 못다 한 말들이 남아서

                      입술 끝에 머물다 사라져


                      너와 걷던 골목 끝 벤치에는

                      계절이 몇 번이나 바뀌었는데

                      내 시간은 그날에 멈춘 채

                      너를 바라보고만 있어


                      혹시 내가 먼저

                      빛이 되어 떠나도

                      울지 말아 줘

                      내가 가장 사랑했던 얼굴로


                      나는 오늘도 너를 사랑해

                      내일이 없어도 변함없이

                      짧은 생이 전부라 해도

                      널 만난 순간은 영원이었어


                      꽃잎처럼 흩어진 시간 끝에도

                      너의 이름은 선명할 테니까

                      나를 기억해 줘

                      슬픔보다 따뜻했던 사람으로


                      병실 창밖 노을이 번질 때면

                      괜히 어린아이처럼 겁이 나

                      끝이라는 단어 하나에도

                      가슴은 아직 익숙하지 않아


