openapi: 3.0.3
info:
  title: YPT (Yeolpumta) API Specification - Cobertura 100%
  description: Especificação técnica oficial completa e exaustiva de todos os 136+
    endpoints da API do Yeolpumta (YPT), incluindo resolução de avatares Studicons,
    fotos de perfil, capturas de Cam Study, mídias de chat e streams de áudio.
  version: 810.0.76
  contact:
    name: OpenYPT Project Team
    url: https://pi.tgclab.com
servers:
- url: https://pi.tgclab.com
  description: API REST Principal (Autenticação, Cronômetro, Grupos, Chat, Planner,
    Ranks)
- url: https://picf.tgclab.com
  description: CDN de Metadados Estáticos (Categorias, Catálogo de Studicons, Ranks
    Globais)
- url: https://alicdn.tgclab.com
  description: CDN de Assets e Mídias (Avatares Studicons .png, Miniaturas, Stickers,
    Cam Logs)
- url: https://alifn.tgclab.com
  description: Microserviço Serverless para Upload Multipart de Mídias
- url: https://alicdn.pallo.cn
  description: CDN de Mídia de Áudio e Capas (Ruído Branco e Playlists)
tags:
- name: Autenticação & Sessão
  description: Login direto JWT, splash-login e reload de perfil
- name: Matérias (Subject Studies)
  description: CRUD de disciplinas de estudo com cores ARGB e ordenação
- name: Cronômetro & Estudo
  description: Início, encerramento e adição retroativa de sessões de estudo
- name: Planner & Scheduler
  description: Tarefas, hábitos, pausas de descanso e calendário
- name: Logs Diários & Estatísticas
  description: Histórico diário e relatórios por intervalo de datas
- name: Rankings
  description: Rankings globais por categoria/país e rankings de membros do grupo
- name: Grupos de Estudo
  description: Busca, detalhes, ingresso e membros em tempo real
- name: Chat & Mídia
  description: Mensagens em grupo, histórico, figurinhas e upload de fotos
- name: Desafios & Missões
  description: Desafios com metas diárias e taxa de entrada
- name: Música & Ruído Branco
  description: Faixas de foco, ruídos brancos e playlists
- name: Grade de Horários (Timetable)
  description: Grade semanal de disciplinas
- name: Studicons & CDN Assets
  description: Avatares, poses de estudo, fotos de perfil e capturas de câmera
- name: Timelapses
  description: Vídeos acelerados de estudo
- name: Central de Notificações
  description: Notificações do sistema e avisos
- name: Configurações Globais
  description: Configurações do sistema e serviços
paths:
  /black:
    get:
      tags:
      - Configurações Globais
      summary: Endpoint GET /black
      description: 'Servidor: `https://pi.tgclab.com`. Processado a partir do tráfego
        capturado.'
      operationId: get_black
      security:
      - JWTAuth: []
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              example:
                s: true
                r: []
  /cam/2026-08-09/16300695:
